name: Release DeployToolkit EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare PowerShell module sources
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Install-PSResource -Name ps2exe -Scope CurrentUser -TrustRepository

      - name: Build EXE with PS2EXE
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          # Stamp the exe with the tag's version (v1.2.0 -> 1.2.0.0); manual runs off a branch keep the default.
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            ./Build-Toolkit-Exe.ps1 -Version $env:GITHUB_REF_NAME
          } else {
            ./Build-Toolkit-Exe.ps1
          }

      - name: Create GitHub Release and upload EXE
        uses: softprops/action-gh-release@v2
        with:
          files: build/CDT.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
